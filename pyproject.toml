[project]
name = "syncwave"
version = "0.3.1"
description = "Turn plain JSON files into a live data store, two-way synced with your Python objects."
readme = "README.md"
authors = [
    { name = "Lucas Iannitello", email = "lucas.iannitello@protonmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
    "typing-extensions>=4.16.0",
    "watchdog>=6.0.0",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: File Formats :: JSON",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://syncwave.dev/"
Documentation = "https://syncwave.dev/"
Repository = "https://github.com/iannitello/syncwave"
Issues = "https://github.com/iannitello/syncwave/issues"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.141.1",
    "mkdocstrings-python>=2.0.9",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "zensical>=0.0.67",
]

[tool.uv]
exclude-newer = "28 days"
exclude-newer-package = { uv_build = false, zensical = false }

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ANN", # flake8-annotations
    "FBT", # flake8-boolean-trap
    "ICN", # flake8-import-conventions
    "PYI", # flake8-pyi
    "SIM", # flake8-simplify
    "RUF", # ruff
    "UP",  # pyupgrade
]
extend-select = [
    "non-imperative-mood",                   # D401
    "docstring-starts-with-this",            # D404
    "missing-blank-line-after-last-section", # D413
]
ignore = [
    "undocumented-magic-method", # D105
    "any-type",                  # ANN401
]
unfixable = [
    "unused-import", # F401
]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "missing-required-import",      # I002
    "missing-terminal-punctuation", # D415
]
"!src/**.py" = ["D"]
"!src/__init__.py" = [
    "undocumented-public-module", # D100
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
extra-standard-library = ["typing_extensions"]
known-third-party = ["fastapi", "pydantic", "syncwave"]
combine-as-imports = true

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["os"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"collections.abc.Callable" = "F"
"pydantic.dataclasses.dataclass" = "py_dataclass"
