[project]
name = "syncwave"
version = "0.2.1"
description = "Turn plain JSON files into a live data store, two-way synced with your Python objects."
readme = "README.md"
authors = [{ name = "Lucas Iannitello", email = "lucas.iannitello@protonmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
    "typing-extensions>=4.15.0",
    "watchdog>=6.0.0",
]
license = { file = "LICENSE" }
keywords = []
classifiers = []

[project.urls]
Homepage = "https://github.com/iannitello/syncwave"
Issues = "https://github.com/iannitello/syncwave/issues"
Repository = "https://github.com/iannitello/syncwave"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.141.1",
    "mkdocstrings-python>=2.0.5",
    "ruff>=0.16.1",
    "ty>=0.0.65",
    "zensical>=0.0.52",
]

[tool.uv]
exclude-newer = "28 days"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ANN",  # flake8-annotations
    "FBT",  # flake8-boolean-trap
    "PYI",  # flake8-pyi
    "SIM",  # flake8-simplify
    "RUF",  # ruff
    "UP",   # pyupgrade
]
preview = true
extend-select = [
    "non-imperative-mood",  # D401
    "docstring-starts-with-this",  # D404
    "missing-blank-line-after-last-section",  # D413
]
ignore = [
    "undocumented-magic-method",  # D105
    "any-type",  # ANN401
]
unfixable = [
    "unused-import",  # F401
]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "missing-required-import",  # I002
    "missing-terminal-punctuation",  # D415
]
"!src/**.py" = ["D"]
"!src/__init__.py" = [
    "undocumented-public-module",  # D100
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
extra-standard-library = ["typing_extensions"]
known-third-party = ["fastapi", "pydantic", "syncwave"]
